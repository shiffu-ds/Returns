[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f3"
textColor = "#0b0b0b"
borderColor = "#e7e5e0"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
